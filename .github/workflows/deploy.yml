name: Build y Deploy Backend (Docker + EC2)

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # =========================
      # LOGIN DOCKER HUB
      # =========================
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================
      # BUILD Y PUSH
      # =========================
      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest

      # =========================
      # DEPLOY BACKEND PRIVADO
      # =========================
      - name: Deploy Backend en EC2 Privada via Bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          # ===== BACKEND PRIVADO =====
          host: ${{ secrets.EC2_BACKEND_PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          # ===== BASTION / FRONTEND PUBLICO =====
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Iniciando deploy backend..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest

            docker stop proyecto_backend || true
            docker rm proyecto_backend || true

            docker run -d \
              --name proyecto_backend \
              -p 3000:3000 \
              --restart always \
              -e DB_HOST='${{ secrets.DB_HOST }}' \
              -e DB_USER='${{ secrets.DB_USER }}' \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e DB_NAME='${{ secrets.DB_NAME }}' \
              -e PORT=3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest

            echo "Deploy backend completado"
