services:
  # ── Servicio Backend (API REST) ─────────────────────────────
  backend:
    build: .
    container_name: proyecto_backend
    restart: unless-stopped

    # ── Variables de entorno para conexión a la BD ─────────────
    environment:
      PORT: 3000

      # nombre del contenedor de MySQL
      DB_HOST: proyecto_mysql
      DB_PORT: 3306

      DB_NAME: proyecto_db
      DB_USER: appuser
      DB_PASSWORD: apppassword

    # ── Exposición del servicio ────────────────────────────────
    ports:
      - "3000:3000"

    # ── Red compartida con MySQL y frontend ────────────────────
    networks:
      - innovatech-net

# ── Red externa compartida ─────────────────────────────────────
networks:
  innovatech-net:
    external: true
